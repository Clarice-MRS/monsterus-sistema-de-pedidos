<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>USMONSTER</title>
</head>
<body>
    <header>
        <button type="button" id="menu"><i class="bi bi-list"></i></button>
        <h1>MONSTERUS</h1>
        <button type="button" id="carrinho"><i class="bi bi-basket"></i></button>
        <button type="button" id="acessibilidade"><i class="bi bi-person-arms-up"></i></button>
    </header>
    <main>
        <section class="tipo-pedido">
            <button type="button" id="botao-delivery"><i class="bi bi-bicycle"></i>DELIVERY</button>
            <button type="button" id="botao-retirada"><i class="bi bi-shop"></i>PEÇA E RETIRE</button>
        </section>
        <section class="filtrar-cardapio">
            <button type="button" class="filtrar-promo"><i class="bi bi-geo-alt"></i>Promoções Peça e Retire</button>
            <button type="button" class="filtrar"><i class="bi bi-emoji-laughing"></i>kids</button>
            <button type="button" class="filtrar"><i class="bi bi-trash2"></i>Acompanhamentos</button>
            <button type="button" class="filtrar"><i class="bi bi-cup-straw"></i>Bebidas</button>
            <button type="button" class="filtrar"><i class="bi bi-fork-knife"></i>Sanduíches</button>
            <button type="button" class="filtrar"><i class="bi bi-cookie"></i>Sobremesas</button>
        </section>
        <section class="carrossel-cardapio">
            <button type="button" id="ant-itens"><i class="bi bi-arrow-left-circle"></i></button>
            <section id="cardapio">       
            </section>
            <button type="button" id="prox-itens"><i class="bi bi-arrow-right-circle"></i></button>
        </section>
    </main>
    <footer>
        <div class="footer-institucional">
            <h1>MONSTERUS</h1>
            <nav class="info-institucional">
                <ul>
                    <li><a href="">Fale Conosco</a></li>
                    <li><a href="">Diretrizes de Privacidade de Dados</a></li>
                    <li><a href="">Trabalhe Conosco</a></li>
                </ul>
            </nav>
        </div>
        <div class="footer-social">
            <h2>Poste seu Pedido Monstruoso</h2>
            <nav>
                <ul>
                    <li><a href="https://www.instagram.com"><i class="bi bi-instagram"></i></a></i></li>
                    <li><a href="https://x.com"><i class="bi bi-twitter-x"></i></a></i></li>
                    <li><a href="https://www.tiktok.com"><i class="bi bi-tiktok"></i></a></li>
                </ul>
            </nav>
            <p>&copy; 2026 LG MONSTER COMPANY - TODOS OS DIREITOS RESERVADOS</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
