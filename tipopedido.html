<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Receba seu Pedido</title>
</head>
<body>

    <header>
        <img src="img/logomonsterus.png" alt="" id="logo">
        <h1>MONSTERUS</h1>
        <a href="index.html" id="home"><i class="bi bi-house-door"></i></a>
        <button type="button" id="acessibilidade"><i class="bi bi-person-arms-up"></i></button>
    </header>

    <main class="configuracao-pedido">

        <section id="form-delivery">

            <h1>Dados para entrega</h1>

            <form id="formulario-delivery">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" required>
                </div>
                <div class="campo">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" required>
                </div>
                <div class="campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" required>
                </div>
                <div class="campo">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento">
                </div>
                <button type="submit" class="confirmar-endereço">
                    Confirmar endereço
                </button>
            </form>

        </section>

        <section id="escolha-restaurante">

            <h1>Escolha onde retirar seu pedido</h1>

            <div class="restaurantes">
                <button type="button" class="restaurante"
                    data-restaurante="Centro"
                    data-endereco="Avenida Belmira Marin, 2011 - São Paulo - SP">
                    
                    <i class="bi bi-shop"></i>
                    <h2>MONSTERUS Grajaú</h2>
                    <p>Avenida Belmira Marin, 2011</p>
                    <p>São Paulo - SP</p>
                </button>

                <button type="button" class="restaurante"
                    data-restaurante="Paulista"
                    data-endereco="Avenida Paulista, 500 - São Paulo - SP">
                    
                    <i class="bi bi-shop"></i>
                    <h2>MONSTERUS Paulista</h2>
                    <p>Avenida Paulista, 500</p>
                    <p>São Paulo - SP</p>
                </button>
            </div>

        </section>
    </main>

        <footer>
        <div class="footer-institucional">
            <img src="img/logomonsterus.png" alt="logo Monsterus"> 
            <h1>MONSTERUS</h1>
            <nav class="info-institucional">
                <ul>
                    <li><a href="index.html">Faça um Pedido</a></li>
                    <li><a href="mailto:monsterus@gmail.com">Fale Conosco</a></li>
                    <li><a href="diretrizes.html">Diretrizes de Privacidade de Dados</a></li>
                    <li><a href="trabalheconosco.html">Trabalhe Conosco</a></li>
                </ul>
            </nav>
        </div>
        <div class="footer-social">
            <h2>Poste seu Pedido Monstruoso</h2>
            <nav>
                <ul>
                    <li><a href="https://www.instagram.com"><i class="bi bi-instagram"></i></a></i></li>
                    <li><a href="https://x.com"><i class="bi bi-twitter-x"></i></a></i></li>
                    <li><a href="https://www.tiktok.com"><i class="bi bi-tiktok"></i></a></li>
                </ul>
            </nav>
            <p>&copy; 2026 LG MONSTER COMPANY - TODOS OS DIREITOS RESERVADOS</p>
        </div>
    </footer>

    <script src="js/tipopedido.js"></script>

</body>
</html>
